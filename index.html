<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aravali SMS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: split login (ridge-line hero + form), then sidebar + content shell that collapses to a stacked menu on phones. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface2:#e8ecf3; --fg:#101828; --muted:#566377; --line:#d3d9e4;
  --accent:#1f3a7a; --accent-fg:#ffffff; --accent-soft:#dfe6f6;
  --good:#146346; --good-soft:#d9f0e5; --warn:#7d5200; --warn-soft:#fae9c4; --bad:#b0231a; --bad-soft:#fde3e0;
  --hero:#13244d; --on-hero:#f2f5ff; --sun:#f0a92b;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d121b; --surface:#151c28; --surface2:#202a3b; --fg:#e8edf6; --muted:#9aa6ba; --line:#2b3649;
  --accent:#8fb0ff; --accent-fg:#0d1a3a; --accent-soft:#1f2d4d;
  --good:#5fd3a0; --good-soft:#12342a; --warn:#f0b94d; --warn-soft:#3a2c0d; --bad:#ff8a7d; --bad-soft:#3d1a17;
  --hero:#0b1530; --on-hero:#f2f5ff; --sun:#f0a92b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d121b; --surface:#151c28; --surface2:#202a3b; --fg:#e8edf6; --muted:#9aa6ba; --line:#2b3649;
  --accent:#8fb0ff; --accent-fg:#0d1a3a; --accent-soft:#1f2d4d;
  --good:#5fd3a0; --good-soft:#12342a; --warn:#f0b94d; --warn-soft:#3a2c0d; --bad:#ff8a7d; --bad-soft:#3d1a17;
  --hero:#0b1530; --on-hero:#f2f5ff; --sun:#f0a92b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--f-body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:28px;font-weight:700} h2{font-size:19px;font-weight:700} h3{font-size:15px;font-weight:700}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:0 4px;min-height:32px;text-decoration:underline}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:grid;gap:6px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.in{width:100%;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.in:disabled{opacity:.6}
select.in{padding-right:8px}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0;align-items:stretch;max-width:1180px;margin:0 auto;padding-block:24px}
.hero{background:var(--hero);color:var(--on-hero);border-radius:16px 0 0 16px;padding:40px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden;min-height:520px}
.hero h1{font-size:38px;max-width:14ch;color:var(--on-hero)}
.hero .eyebrow{color:var(--on-hero);opacity:.75}
.hero p{max-width:40ch;opacity:.85}
.ridge{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;color:var(--on-hero);pointer-events:none}
.hero .top,.hero .bot{position:relative;z-index:1;display:grid;gap:14px}
.crest{width:44px;height:44px;border-radius:10px;background:var(--on-hero);color:var(--hero);display:grid;place-items:center;font:700 15px var(--f-display);letter-spacing:.02em}
.logincard{background:var(--surface);border:1px solid var(--line);border-left:0;border-radius:0 16px 16px 0;padding:40px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);padding:4px;border-radius:10px;gap:4px}
.seg button{border:0;background:none;min-height:36px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.15)}
.form{display:grid;gap:14px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.msg{font-size:13px;min-height:18px}
.msg.ok{color:var(--good)} .msg.bad{color:var(--bad)}
.demo{display:grid;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:12px}
.demo .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
@media (max-width:860px){
  .login{grid-template-columns:minmax(0,1fr);padding-block:12px}
  .hero{border-radius:16px 16px 0 0;min-height:300px;padding:24px}
  .hero h1{font-size:28px}
  .logincard{border-left:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;padding:24px}
}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:24px;align-items:start;max-width:1240px;margin:0 auto;padding-block:16px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:14px}
.sidehead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center;min-width:0;flex:1}
.logoplate{background:#fff;border-radius:10px;padding:8px 12px;box-shadow:0 0 0 1px rgb(0 0 0/.08)}
.logoplate img{display:block;width:100%;max-width:100%;height:auto}
.hero-logo{max-width:320px}
.brand b{font:700 14px/1.2 var(--f-display)}
.brand .crest{width:36px;height:36px;font-size:13px;flex:none;background:var(--hero);color:var(--on-hero)}
.menubtn{display:none}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;min-height:40px;padding:0 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.me{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.me b{display:block;overflow-wrap:anywhere}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{position:static}
  .menubtn{display:inline-flex}
  .side.closed .navwrap{display:none}
}
main.content{min-width:0;display:grid;gap:20px}
.pagehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.pagehead p{color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.g-sel{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:420px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}

/* attendance */
.stat{min-width:104px;min-height:34px;border-radius:8px;border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);cursor:pointer;font-weight:600}
.stat.on{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.count{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar{height:8px;background:var(--surface2);border-radius:99px;position:relative;overflow:visible;flex:1;min-width:120px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--good));width:calc(var(--p)*1%)}
.bar::after{content:"";position:absolute;left:75%;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.45;border-radius:2px}
.pill{display:inline-block;min-width:48px;text-align:center;padding:2px 8px;border-radius:99px;font:500 12px var(--f-mono);background:var(--surface2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font:500 11px var(--f-mono);padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.ring{--s:92px;--c:var(--good);width:var(--s);aspect-ratio:1;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;font:500 17px var(--f-mono)}
.ring.good{--c:var(--good)} .ring.warn{--c:var(--warn)} .ring.bad{--c:var(--bad)}
.ring.big{--s:132px} .ring.big span{font-size:26px}
.bar.good{--c:var(--good)} .bar.warn{--c:var(--warn)} .bar.bad{--c:var(--bad)}
.subcard{display:grid;gap:12px}
.subcard .row{display:flex;gap:14px;align-items:center}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:12px;padding:12px 14px}
.alert.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.alert b{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}
.timeline li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.timeline li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent);margin-top:3px}
.timeline .dot.absent{background:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.timeline .dot.present{background:var(--good);box-shadow:0 0 0 1px var(--good)}
.tl-body{min-width:0;display:grid;gap:2px}
.tl-body .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-open{border:0;background:none;text-align:left;cursor:pointer;padding:0;display:block;width:100%}
.tl-open:hover b{text-decoration:underline}
.nameinput{min-width:150px}
.scoreinput{width:92px;text-align:right}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{font-size:12px;color:var(--muted)}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.subchips{display:flex;gap:6px;flex-wrap:wrap;min-width:200px}
.pwcard{max-width:460px}

/* guest */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats .card b{display:block;font:500 26px var(--f-mono)}
.deps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.deps .card{display:grid;gap:6px}

#toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none;z-index:20}
#toast div{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:100%;box-shadow:0 8px 24px rgb(0 0 0/.25)}
@media (prefers-reduced-motion:no-preference){.btn,.stat,.chip{transition:background .15s,filter .15s}}
</style>

function seed(){
  var names=["Aarav Sharma","Diya Yadav","Kabir Singh","Meera Chauhan","Rohan Gupta","Sneha Verma","Arjun Tanwar","Ishita Malik"];
  var students=names.map(function(n,i){return {id:"S"+(101+i),roll:String(FIRST_ROLL+i),name:n,pass:"student123"};});
  var subjects=[
    {code:"DSA",name:"Data Structures & Algorithms"},
    {code:"ETC",name:"ETC"},
    {code:"DE",name:"Digital Electronics"},
    {code:"AEC",name:"AEC"},
    {code:"M3",name:"Mathematics III"}
  ];
  var teachers=[
    {id:"T01",name:"Dr. Neha Kapoor",pass:"teacher123",subjects:["DSA","DE"]},
    {id:"T02",name:"Prof. Rajiv Malhotra",pass:"teacher123",subjects:["ETC","AEC"]},
    {id:"T03",name:"Dr. Sunita Rao",pass:"teacher123",subjects:["M3"]}
  ];
  var exams=[{id:"E1",name:"Class Test 1",max:20},{id:"E2",name:"Mid Semester",max:30},{id:"E3",name:"End Semester",max:70}];
  var dates=[],d=new Date();d.setHours(12);
  while(dates.length<10){d.setDate(d.getDate()-1);var w=d.getDay();if(w!==0&&w!==6)dates.unshift(iso(d));}
  var x=11;function rnd(){x=(x*1664525+1013904223)%4294967296;return x/4294967296;}
  var prob=[.96,.9,.62,.85,.7,.97,.5,.8];
  var ab=[.9,.8,.5,.7,.6,.95,.35,.65];
  var records={},marks={};
  subjects.forEach(function(s,si){
    var t=teachers.filter(function(t){return t.subjects.indexOf(s.code)>-1;})[0];
    records[s.code]=dates.map(function(dt,k){
      var m={};students.forEach(function(st,i){m[st.id]=rnd()<prob[i];});
      return {lecture:k+1,date:dt,slot:si%SLOTS.length,teacher:t.name,teacherId:t.id,
        ts:new Date(dt+"T"+SLOTS[si%SLOTS.length].slice(0,5)+":00").toISOString(),marks:m};
    });
    marks[s.code]={};
    exams.forEach(function(e){
      marks[s.code][e.id]={};
      if(e.id==="E3")return;
      students.forEach(function(st,i){
        var v=Math.round(e.max*Math.min(1,0.3+0.65*ab[i]*(0.85+0.3*rnd())));
        marks[s.code][e.id][st.id]=v;
      });
    });
  });
  return {admin:{id:"ADMIN",name:"Administrator",pass:"admin123"},students:students,teachers:teachers,subjects:subjects,exams:exams,records:records,marks:marks};
}
function load(){try{var r=localStorage.getItem(KEY);if(r){var j=JSON.parse(r);if(j&&j.students&&j.records&&j.subjects&&j.exams&&j.admin&&j.marks)return j;}}catch(e){}return seed();}
var DB=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}

function subj(code){return DB.subjects.filter(function(s){return s.code===code;})[0];}
function stat(sid,code){
  var rs=DB.records[code]||[],p=0;
  rs.forEach(function(r){if(r.marks[sid])p++;});
  return {held:rs.length,present:p,pct:rs.length?Math.round(p/rs.length*100):null};
}
function overall(sid){
  var h=0,p=0;
  DB.subjects.forEach(function(s){var a=stat(sid,s.code);h+=a.held;p+=a.present;});
  return {held:h,present:p,pct:h?Math.round(p/h*100):null};
}
function lvl(p){return p==null?"na":p>=75?"good":p>=60?"warn":"bad";}
function mlvl(p){return p==null?"na":p>=60?"good":p>=40?"warn":"bad";}
function pill(p){return '<span class="pill '+lvl(p)+'">'+(p==null?"–":p+"%")+'</span>';}
function mpill(p){return '<span class="pill '+mlvl(p)+'">'+(p==null?"–":p+"%")+'</span>';}
function ring(p,big){return '<div class="ring '+lvl(p)+(big?" big":"")+'" style="--p:'+(p||0)+'" role="img" aria-label="'+(p==null?"No lectures yet":p+" percent attendance")+'"><span>'+(p==null?"–":p+"%")+'</span></div>';}
function getScore(code,ex,sid){var a=DB.marks[code]&&DB.marks[code][ex];return a&&a[sid]!=null?a[sid]:null;}
function markPct(code,ex,sid){var s=getScore(code,ex,sid),e=DB.exams.filter(function(x){return x.id===ex;})[0];return s==null||!e?null:Math.round(s/e.max*100);}
function markSummary(code,ex){
  var e=DB.exams.filter(function(x){return x.id===ex;})[0],n=0,tot=0;
  DB.students.forEach(function(s){var v=getScore(code,ex,s.id);if(v!=null){n++;tot+=v;}});
  return n+" of "+DB.students.length+" entered"+(n&&e?" · average "+(Math.round(tot/n*10)/10)+" / "+e.max:"");
}
function nextRoll(){
  var m=FIRST_ROLL-1;
  DB.students.forEach(function(s){if(/^\d+$/.test(s.roll)){var n=Number(s.roll);if(n>m)m=n;}});
  return String(m+1);
}
function nextId(list,prefix,start){
  var m=start;list.forEach(function(x){var n=parseInt(String(x.id).slice(prefix.length),10);if(n>m)m=n;});
  return prefix+(prefix==="T"?pad(m+1):(m+1));
}

function noSubjects(title){

function initDraft(){
  var subs=teacherSubjects();
  if(!S.sel.subject||!subs.some(function(s){return s.code===S.sel.subject;}))S.sel.subject=subs[0].code;
  var recs=DB.records[S.sel.subject]||[],next=recs.length+1;
  if(S.sel.lecture==null||S.sel.lecture>next)S.sel.lecture=next;
  var key=S.sel.subject+":"+S.sel.lecture+":"+DB.students.length;
  if(S.sel.draftKey!==key||!S.sel.draft){
    var ex=recs.filter(function(r){return r.lecture===S.sel.lecture;})[0];
    var m={};
    DB.students.forEach(function(st){m[st.id]=ex?!!ex.marks[st.id]:false;});
    S.sel.draft={marks:m,date:ex?ex.date:iso(new Date()),slot:ex?ex.slot:Math.min(SLOTS.length-1,recs.length?recs[recs.length-1].slot:0),existing:!!ex};
    S.sel.draftKey=key;
  }
}
VIEWS.mark=function(){
  if(!teacherSubjects().length)return noSubjects("Attendance");
  initDraft();
  var subs=teacherSubjects(),code=S.sel.subject,recs=DB.records[code]||[],next=recs.length+1,dr=S.sel.draft,n=S.sel.lecture;
  var present=DB.students.filter(function(s){return dr.marks[s.id];}).length,total=DB.students.length;
  var pct=total?Math.round(present/total*100):0;
  var lopts="";
  for(var i=1;i<=next;i++){
    var r=recs.filter(function(x){return x.lecture===i;})[0];
    lopts+='<option value="'+i+'"'+(i===n?" selected":"")+'>Lecture '+i+(r?" · "+fmt(r.date):" (new)")+'</option>';
  }
  var rows=DB.students.map(function(s,i){
    var on=dr.marks[s.id];
    return '<tr><td class="mono muted">'+(i+1)+'</td><td class="mono">'+esc(s.roll)+'</td><td>'+esc(s.name)+'</td><td class="num">'+
      '<button type="button" class="stat'+(on?" on":"")+'" data-a="toggle" data-id="'+s.id+'" aria-pressed="'+on+'" aria-label="'+esc(s.name)+': '+(on?"Present":"Absent")+'">'+(on?"Present":"Absent")+'</button></td></tr>';
  }).join("");
  var feed=recs.slice().reverse().map(function(r){
    var p=DB.students.filter(function(s){return r.marks[s.id];}).length;
    return '<li><span class="dot"></span><div class="tl-body"><button type="button" class="tl-open" data-a="open" data-n="'+r.lecture+'">'+
      '<div class="line"><b>Lecture '+r.lecture+'</b><span class="tag">'+esc(code)+'</span><span class="mono muted">'+p+'/'+DB.students.length+' present</span></div>'+
      '<span class="muted">'+fmt(r.date)+' · '+SLOTS[r.slot]+'</span><br><span class="muted">Taken by '+esc(r.teacher)+'</span></button></div></li>';
  }).join("");
  var canDelete=dr.existing&&n===recs.length;
  var delBtn="";
  if(canDelete){
    delBtn=S.confirm==="dellec"?'<button class="btn sm danger" type="button" data-a="delok">Yes, delete Lecture '+n+'</button><button class="btn sm" type="button" data-a="cancel">Cancel</button>'
      :'<button class="btn sm danger" type="button" data-a="delask">Delete this lecture</button>';
  }
  return '<div class="pagehead"><div><h1>Attendance</h1><p>Pick the subject and lecture, mark each student, then save.</p></div>'+
    '<span class="lock">'+ICON.lock+'Only teachers and administrators can change attendance</span></div>'+
  '<div class="card"><div class="grid g-sel">'+
    '<label class="f" for="f-subject">Subject<select class="in" id="f-subject" data-f="subject">'+subs.map(function(s){return '<option value="'+esc(s.code)+'"'+(s.code===code?" selected":"")+'>'+esc(s.code)+' · '+esc(s.name)+'</option>';}).join("")+'</select></label>'+
    '<label class="f" for="f-lecture">Lecture<select class="in" id="f-lecture" data-f="lecture">'+lopts+'</select></label>'+
    '<label class="f" for="f-date">Date<input class="in" id="f-date" type="date" data-f="date" value="'+dr.date+'"></label>'+
    '<label class="f" for="f-slot">Time slot<select class="in" id="f-slot" data-f="slot">'+SLOTS.map(function(s,i){return '<option value="'+i+'"'+(i===dr.slot?" selected":"")+'>'+s+'</option>';}).join("")+'</select></label>'+
  '</div></div>'+
  '<div class="split"><div class="card"><div class="cardhead"><div><h2>Class roster</h2><span class="muted">'+esc(code)+' · Lecture '+n+(dr.existing?" · editing saved record":" · new lecture")+'</span></div>'+
    '<div class="actions"><button class="btn sm" type="button" data-a="allp">Select all present</button><button class="btn sm" type="button" data-a="allabs">Clear all</button></div></div>'+
    '<div class="count" style="margin-bottom:14px"><b class="mono">'+present+' / '+total+' present</b><div class="bar '+lvl(pct)+'" style="--p:'+pct+'"><i></i></div><span class="mono muted">'+pct+'%</span></div>'+
    '<div class="tablewrap"><table><thead><tr><th>#</th><th>Roll no.</th><th>Student</th><th class="num">Status</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="muted">No students yet. Add them in the Students section.</td></tr>')+'</tbody></table></div>'+
    '<div class="actions" style="margin-top:14px;justify-content:space-between"><div class="actions">'+delBtn+'</div><button class="btn primary" type="button" data-a="save"'+(total?"":" disabled")+'>'+(dr.existing?"Update Lecture "+n:"Save Lecture "+n)+'</button></div></div>'+

    (feed?'<ul class="timeline">'+feed+'</ul>':'<p class="muted">No lectures saved for '+esc(code)+' yet.</p>')+'</div></div>';
};

      '<td class="num">'+(ask?'<button class="btn sm danger" type="button" data-a="rmeok" data-id="'+e.id+'">Confirm remove</button> <button class="btn sm" type="button" data-a="cancel">Cancel</button>':'<button class="btn sm" type="button" data-a="rmeask" data-id="'+e.id+'">Remove</button>')+'</td></tr>';
  }).join("");
  return '<div class="pagehead"><div><h1>Subjects & exams</h1><p>Add subjects, rename them or remove them. Define the exams that teachers record marks for.</p></div><span class="lock">'+ICON.lock+'Administrator only</span></div>'+
  '<div class="card"><h2 style="margin-bottom:12px">Add a subject</h2>'+
    '<form class="grid g-sel" id="adds" autocomplete="off" style="align-items:end">'+
      '<label class="f" for="s-code">Short code<input class="in mono" id="s-code" maxlength="8" required placeholder="OS"></label>'+
      '<label class="f" for="s-name">Subject name<input class="in" id="s-name" required placeholder="Operating Systems"></label>'+
      '<button class="btn primary" type="submit">Add subject</button></form></div>'+
  '<div class="card"><div class="cardhead"><h2>Subjects</h2><span class="mono muted">'+DB.subjects.length+' subjects</span></div>'+
    '<div class="tablewrap"><table style="min-width:640px"><thead><tr><th>Code</th><th>Name</th><th>Lectures</th><th>Teachers</th><th class="num">Action</th></tr></thead><tbody>'+(srows||'<tr><td colspan="5" class="muted">No subjects yet.</td></tr>')+'</tbody></table></div>'+
    '<p class="notice" style="margin-top:10px">Removing a subject also deletes its attendance and marks. Assign subjects to teachers in the Teachers section.</p></div>'+
  '<div class="card"><h2 style="margin-bottom:12px">Add an exam</h2>'+
    '<form class="grid g-sel" id="adde" autocomplete="off" style="align-items:end">'+
      '<label class="f" for="e-name">Exam name<input class="in" id="e-name" required placeholder="Class Test 2"></label>'+
      '<label class="f" for="e-max">Maximum marks<input class="in mono" id="e-max" type="number" min="1" step="1" required placeholder="20"></label>'+
      '<button class="btn primary" type="submit">Add exam</button></form></div>'+
  '<div class="card"><div class="cardhead"><h2>Exams</h2><span class="mono muted">'+DB.exams.length+' exams</span></div>'+
    '<div class="tablewrap"><table style="min-width:480px"><thead><tr><th>Name</th><th>Max marks</th><th class="num">Action</th></tr></thead><tbody>'+(erows||'<tr><td colspan="3" class="muted">No exams yet.</td></tr>')+'</tbody></table></div></div>';
};

/* ---------- student ---------- */
VIEWS.me=function(){
  var st=currentUser(),o=overall(st.id);
  var per=DB.subjects.map(function(s){var a=stat(st.id,s.code);a.s=s;return a;});
  var low=per.filter(function(a){return a.pct!=null&&a.pct<75;});
  var alertHtml=low.length?
    '<div class="alert" role="alert">'+ICON.warn+'<div><b>Attendance below 75% in '+low.length+(low.length>1?" subjects":" subject")+'</b>'+low.map(function(a){return esc(a.s.code)+" ("+a.pct+"%)";}).join(", ")+'. The cards below show what it takes to recover.</div></div>':
    '<div class="alert ok">'+ICON.check+'<div><b>You are above 75% in every subject</b>Keep it up.</div></div>';
  var cards=per.map(function(a){
    var need=Math.max(0,3*a.held-4*a.present);
    return '<div class="card subcard"><div><span class="tag">'+esc(a.s.code)+'</span> <b>'+esc(a.s.name)+'</b></div>'+
      '<div class="row">'+ring(a.pct)+'<div><b class="mono">'+a.present+' / '+a.held+'</b><br><span class="muted">lectures attended</span></div></div>'+
      '<div class="bar '+lvl(a.pct)+'" style="--p:'+(a.pct||0)+'"><i></i></div>'+
      (a.pct!=null&&a.pct<75?'<span class="notice" style="color:var(--warn)">Attend the next '+need+' lecture'+(need===1?"":"s")+' in a row to reach 75%.</span>':'<span class="notice">'+(a.held?"On track.":"No lectures yet.")+'</span>')+'</div>';
  }).join("");
  var log=[];
  DB.subjects.forEach(function(s){(DB.records[s.code]||[]).forEach(function(r){log.push({code:s.code,r:r});});});
  log.sort(function(a,b){return a.r.ts<b.r.ts?1:-1;});
  if(S.filter!=="ALL")log=log.filter(function(x){return x.code===S.filter;});
  var items=log.slice(0,24).map(function(x){
    var p=!!x.r.marks[st.id];
    return '<li><span class="dot '+(p?"present":"absent")+'"></span><div class="tl-body"><div class="line"><b>'+esc(x.code)+' · Lecture '+x.r.lecture+'</b><span class="pill '+(p?"good":"bad")+'">'+(p?"Present":"Absent")+'</span></div>'+
      '<span class="muted">'+fmt(x.r.date)+' · '+SLOTS[x.r.slot]+' · '+esc(x.r.teacher)+'</span></div></li>';
  }).join("");
  var chips=['<button type="button" class="chip" data-a="filter" data-v="ALL" aria-pressed="'+(S.filter==="ALL")+'">All</button>'].concat(DB.subjects.map(function(s){return '<button type="button" class="chip" data-a="filter" data-v="'+esc(s.code)+'" aria-pressed="'+(S.filter===s.code)+'">'+esc(s.code)+'</button>';})).join("");
  /* marks table */
  var mhead=DB.exams.map(function(e){return '<th class="num">'+esc(e.name)+'<br><span class="mono" style="text-transform:none;letter-spacing:0">out of '+e.max+'</span></th>';}).join("");
  var mrows=DB.subjects.map(function(s){
    var got=0,max=0;
    var cells=DB.exams.map(function(e){
      var v=getScore(s.code,e.id,st.id);
      if(v!=null){got+=v;max+=e.max;}
      return '<td class="num mono">'+(v==null?'<span class="muted">–</span>':v)+'</td>';
    }).join("");
    return '<tr><td><span class="tag">'+esc(s.code)+'</span> '+esc(s.name)+'</td>'+cells+'<td class="num">'+(max?mpill(Math.round(got/max*100)):mpill(null))+'</td></tr>';
  }).join("");
  return '<div class="pagehead"><div><h1>My record</h1><p>'+esc(st.name)+' · <span class="mono">'+esc(st.roll)+'</span></p></div>'+
    '<span class="lock">'+ICON.lock+'View only. Your teachers update this.</span></div>'+
  '<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">'+ring(o.pct,true)+
    '<div style="min-width:0"><span class="eyebrow">Overall attendance</span><h2 style="font-size:24px;margin:4px 0">'+(o.pct==null?"No lectures yet":o.present+" of "+o.held+" lectures")+'</h2><p class="muted">The minimum is 75%.</p></div></div>'+
  alertHtml+
  '<div class="grid g-cards">'+cards+'</div>'+
  '<div class="card"><div class="cardhead"><h2>Exam marks</h2></div>'+
    (DB.subjects.length&&DB.exams.length?'<div class="tablewrap"><table style="min-width:560px"><thead><tr><th>Subject</th>'+mhead+'<th class="num">Total</th></tr></thead><tbody>'+mrows+'</tbody></table></div><p class="notice" style="margin-top:10px">Total covers the exams that have been marked so far. A dash means marks are not entered yet.</p>':'<p class="muted">No exams to show.</p>')+'</div>'+
  '<div class="card"><div class="cardhead"><h2>Lecture log</h2><div class="chips">'+chips+'</div></div>'+
    (items?'<ul class="timeline">'+items+'</ul>':'<p class="muted">No lectures to show.</p>')+'</div>';
};

/* ---------- guest ---------- */
function viewGuest(){
  var deps=[["Computer Science & Engineering","DSA and software fundamentals, data and systems."],["Electronics & Communication","ETC and Digital Electronics labs."],["Mechanical Engineering","Design, thermal and manufacturing."],["Civil Engineering","Structures, surveying and materials."],["Management Studies","Business communication and analytics."]];
  var cur=DB.subjects.map(function(s){return '<tr><td><span class="tag">'+esc(s.code)+'</span></td><td>'+esc(s.name)+'</td></tr>';}).join("");
  return '<div class="pagehead"><div><span class="eyebrow">Public portal</span><h1>Welcome to Aravali College of Engineering and Management</h1><p>A guest view. No student records are shown here.</p></div></div>'+

  '<div class="card"><h2 style="margin-bottom:12px">Departments</h2><div class="deps">'+deps.map(function(d){return '<div class="card" style="background:var(--bg)"><b>'+d[0]+'</b><span class="muted">'+d[1]+'</span></div>';}).join("")+'</div></div>'+

VIEWS.portal=viewGuest;

/* ---------- render ---------- */
function render(){
  var app=document.getElementById("app");
  app.innerHTML=S.user?viewShell():viewLogin();
}
function go(role,id){
  S.user={role:role,id:id};S.menuOpen=false;S.confirm=null;S.err="";S.pwMsg=null;
  S.view=role==="admin"?"overview":role==="teacher"?"mark":role==="student"?"me":"portal";
  S.sel={subject:null,lecture:null,draftKey:"",draft:null};
  S.mk={subject:null,exam:null};
  render();window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,v=b.dataset.v,id=b.dataset.id;
  if(a==="role"){S.role=v;S.err="";render();}
  else if(a==="fill"){var f=ROLE_INFO[S.role].demo;document.getElementById("uid").value=f[0];document.getElementById("pw").value=f[1];}
  else if(a==="guest"){go("guest","guest");}
  else if(a==="menu"){S.menuOpen=!S.menuOpen;render();}
  else if(a==="nav"){S.view=v;S.menuOpen=false;S.confirm=null;S.pwMsg=null;render();}
  else if(a==="signout"){S.user=null;S.err="";render();window.scrollTo(0,0);}
  else if(a==="cancel"){S.confirm=null;render();}
  else if(a==="toggle"){S.sel.draft.marks[id]=!S.sel.draft.marks[id];render();}
  else if(a==="allp"){DB.students.forEach(function(s){S.sel.draft.marks[s.id]=true;});render();}
  else if(a==="allabs"){DB.students.forEach(function(s){S.sel.draft.marks[s.id]=false;});render();}
  else if(a==="open"){S.sel.lecture=parseInt(b.dataset.n,10);S.sel.draft=null;S.confirm=null;render();window.scrollTo(0,0);}
  else if(a==="save"){saveLecture();}
  else if(a==="delask"){S.confirm="dellec";render();}
  else if(a==="delok"){DB.records[S.sel.subject].pop();save();S.confirm=null;S.sel.lecture=null;S.sel.draft=null;render();toast("Lecture deleted");}
  else if(a==="rmask"){S.confirm="rm:"+id;render();}
  else if(a==="rmok"){
    DB.students=DB.students.filter(function(s){return s.id!==id;});
    DB.subjects.forEach(function(s){
      (DB.records[s.code]||[]).forEach(function(r){delete r.marks[id];});
      var m=DB.marks[s.code]||{};Object.keys(m).forEach(function(k){delete m[k][id];});
    });
    save();S.confirm=null;S.sel.draft=null;render();toast("Student removed");
  }
  else if(a==="rmtask"){S.confirm="rmt:"+id;render();}
  else if(a==="rmtok"){DB.teachers=DB.teachers.filter(function(t){return t.id!==id;});save();S.confirm=null;render();toast("Teacher removed");}
  else if(a==="tsub"){
    var t=DB.teachers.filter(function(x){return x.id===id;})[0],i=t.subjects.indexOf(v);
    if(i>-1)t.subjects.splice(i,1);else t.subjects.push(v);
    save();render();
  }
  else if(a==="resetpw"){
    var list=b.dataset.k==="s"?DB.students:DB.teachers,u=list.filter(function(x){return x.id===id;})[0];
    u.pass=b.dataset.k==="s"?"student123":"teacher123";save();
    toast("Password for "+u.name+" reset to "+u.pass);
  }
  else if(a==="rmsask"){S.confirm="rms:"+v;render();}
  else if(a==="rmsok"){
    DB.subjects=DB.subjects.filter(function(s){return s.code!==v;});
    delete DB.records[v];delete DB.marks[v];
    DB.teachers.forEach(function(t){t.subjects=t.subjects.filter(function(c){return c!==v;});});
    if(S.filter===v)S.filter="ALL";
    S.sel={subject:null,lecture:null,draftKey:"",draft:null};S.mk.subject=null;
    save();S.confirm=null;render();toast("Subject "+v+" removed");
  }
  else if(a==="rmeask"){S.confirm="rme:"+id;render();}
  else if(a==="rmeok"){
    DB.exams=DB.exams.filter(function(x){return x.id!==id;});
    Object.keys(DB.marks).forEach(function(c){delete DB.marks[c][id];});
    S.mk.exam=null;save();S.confirm=null;render();toast("Exam removed");
  }
  else if(a==="resetask"){S.confirm="resetall";render();}
  else if(a==="resetok"){
    DB=seed();save();S.confirm=null;S.sel={subject:null,lecture:null,draftKey:"",draft:null};S.mk={subject:null,exam:null};S.filter="ALL";render();toast("Demo data restored");
  }
  else if(a==="filter"){S.filter=v;render();}
});
function saveLecture(){
  var t=currentUser(),dr=S.sel.draft,code=S.sel.subject,recs=DB.records[code],n=S.sel.lecture;
  if(!dr.date){toast("Choose a date first");return;}
  var rec={lecture:n,date:dr.date,slot:dr.slot,teacher:t.name,teacherId:t.id,ts:new Date().toISOString(),marks:JSON.parse(JSON.stringify(dr.marks))};
  var i=recs.findIndex(function(r){return r.lecture===n;});
  if(i>-1)recs[i]=rec;else recs.push(rec);
  save();
  var p=DB.students.filter(function(s){return rec.marks[s.id];}).length;
  S.sel.draft=null;
  if(i<0)S.sel.lecture=null;
  render();toast(code+" Lecture "+n+" saved · "+p+" of "+DB.students.length+" present");
}
function rollTaken(roll,exceptId){return DB.students.some(function(s){return s.roll===roll&&s.id!==exceptId;});}
document.addEventListener("change",function(e){
  var el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;
  if(f==="subject"){S.sel.subject=el.value;S.sel.lecture=null;S.sel.draft=null;S.confirm=null;render();}
  else if(f==="lecture"){S.sel.lecture=parseInt(el.value,10);S.sel.draft=null;S.confirm=null;render();}
  else if(f==="date"){S.sel.draft.date=el.value;}
  else if(f==="slot"){S.sel.draft.slot=parseInt(el.value,10);}
  else if(f==="mksubject"){S.mk.subject=el.value;render();}
  else if(f==="mkexam"){S.mk.exam=el.value;render();}
  else if(f==="score"){
    var ex=DB.exams.filter(function(x){return x.id===S.mk.exam;})[0],code=S.mk.subject,sid=el.dataset.id;
    var bucket=DB.marks[code][S.mk.exam]=DB.marks[code][S.mk.exam]||{};
    var raw=el.value.trim();
    if(raw===""){delete bucket[sid];}
    else{
      var n=parseFloat(raw);
      if(isNaN(n)||n<0||n>ex.max){var old=bucket[sid];el.value=old==null?"":old;toast("Enter a value between 0 and "+ex.max);return;}
      bucket[sid]=Math.round(n*2)/2;el.value=bucket[sid];
    }
    save();
    var pc=document.getElementById("pc-"+sid);if(pc)pc.innerHTML=mpill(markPct(code,S.mk.exam,sid));
    var sm=document.getElementById("mk-sum");if(sm)sm.textContent=markSummary(code,S.mk.exam);
  }
  else if(f==="sname"||f==="sroll"){
    var s=DB.students.filter(function(x){return x.id===el.dataset.id;})[0];
    var val=el.value.trim();
    if(!s)return;
    if(!val){el.value=f==="sname"?s.name:s.roll;toast("This field cannot be empty");return;}
    if(f==="sroll"&&rollTaken(val,s.id)){el.value=s.roll;toast("That roll number is already in use");return;}
    if(f==="sname")s.name=val;else s.roll=val;
    save();toast("Saved "+s.name);
  }
  else if(f==="tname"){
    var t=DB.teachers.filter(function(x){return x.id===el.dataset.id;})[0],tv=el.value.trim();
    if(!t)return;
    if(!tv){el.value=t.name;toast("Name cannot be empty");return;}
    t.name=tv;save();toast("Saved "+t.name);
  }
  else if(f==="subname"){
    var sb=subj(el.dataset.v),sv=el.value.trim();
    if(!sb)return;
    if(!sv){el.value=sb.name;toast("Name cannot be empty");return;}
    sb.name=sv;save();toast("Saved "+sb.code);
  }
  else if(f==="exname"){
    var xe=DB.exams.filter(function(x){return x.id===el.dataset.id;})[0],xv=el.value.trim();
    if(!xe)return;
    if(!xv){el.value=xe.name;toast("Name cannot be empty");return;}
    xe.name=xv;save();toast("Saved "+xe.name);
  }
  else if(f==="exmax"){
    var xm=DB.exams.filter(function(x){return x.id===el.dataset.id;})[0],mv=parseFloat(el.value);
    if(!xm)return;
    if(isNaN(mv)||mv<1){el.value=xm.max;toast("Maximum must be at least 1");return;}
    var over=false;
    Object.keys(DB.marks).forEach(function(c){var b=DB.marks[c][xm.id]||{};Object.keys(b).forEach(function(k){if(b[k]>mv)over=true;});});
    if(over){el.value=xm.max;toast("Some students already have more than "+mv+". Fix their marks first.");return;}
    xm.max=mv;save();toast("Saved "+xm.name);
  }
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target;
  if(f.id==="loginform"){
    var id=document.getElementById("uid").value.trim().toUpperCase(),pw=document.getElementById("pw").value;
    var u=null;
    if(S.role==="student")u=DB.students.filter(function(x){return (x.roll===id||x.id===id)&&x.pass===pw;})[0];
    else if(S.role==="teacher")u=DB.teachers.filter(function(x){return x.id===id&&x.pass===pw;})[0];
    else if(DB.admin.id===id&&DB.admin.pass===pw)u=DB.admin;
    if(!u){S.err="ID or password is incorrect. Check the role above and try again.";render();document.getElementById("uid").value=id;return;}
    go(S.role,u.id);
  }else if(f.id==="addform"){
    var name=document.getElementById("a-name").value.trim(),roll=document.getElementById("a-roll").value.trim();
    if(!name||!roll)return;
    if(rollTaken(roll,null)){toast("That roll number is already in use");return;}
    DB.students.push({id:nextId(DB.students,"S",100),roll:roll,name:name,pass:"student123"});
    save();S.sel.draft=null;render();toast(name+" added with roll number "+roll);
  }else if(f.id==="addt"){
    var tn=document.getElementById("t-name").value.trim();if(!tn)return;
    var tid=nextId(DB.teachers,"T",0);
    DB.teachers.push({id:tid,name:tn,pass:"teacher123",subjects:[]});
    save();render();toast(tn+" added with ID "+tid);
  }else if(f.id==="adds"){
    var code=document.getElementById("s-code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,""),sn=document.getElementById("s-name").value.trim();
    if(!code||!sn){toast("Enter a code using letters or numbers, and a name");return;}
    if(subj(code)){toast("Subject code "+code+" already exists");return;}
    DB.subjects.push({code:code,name:sn});DB.records[code]=[];DB.marks[code]={};
    save();render();toast(code+" added. Assign it to a teacher in Teachers.");
  }else if(f.id==="adde"){
    var en=document.getElementById("e-name").value.trim(),em=parseFloat(document.getElementById("e-max").value);
    if(!en||isNaN(em)||em<1){toast("Enter an exam name and maximum marks");return;}
    var eid=nextId(DB.exams,"E",0);
    DB.exams.push({id:eid,name:en,max:em});save();render();toast(en+" added");
  }else if(f.id==="pwform"){
    var u2=currentUser(),cur=document.getElementById("pw-cur").value,nw=document.getElementById("pw-new").value,cf=document.getElementById("pw-conf").value;
    if(cur!==u2.pass)S.pwMsg={ok:false,text:"Current password is incorrect."};
    else if(nw.length<6)S.pwMsg={ok:false,text:"New password must be at least 6 characters."};
    else if(nw!==cf)S.pwMsg={ok:false,text:"The two new passwords do not match."};
    else if(nw===cur)S.pwMsg={ok:false,text:"Choose a password different from the current one."};
    else{u2.pass=nw;save();S.pwMsg={ok:true,text:"Password updated. Use it the next time you sign in."};toast("Password updated");}
    render();
  }
});
render();
})();
</script>
